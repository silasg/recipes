services:
  db_source:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: djangodb
      POSTGRES_USER: djangouser
      POSTGRES_PASSWORD: source_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djangouser -d djangodb"]
      interval: 3s
      timeout: 3s
      retries: 10

  db_target:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: djangodb
      POSTGRES_USER: djangouser
      POSTGRES_PASSWORD: target_test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djangouser -d djangodb"]
      interval: 3s
      timeout: 3s
      retries: 10

  source:
    image: vabene1111/recipes:2.6.4
    environment:
      SECRET_KEY: source-test-secret-key-not-for-production
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: db_source
      POSTGRES_DB: djangodb
      POSTGRES_PORT: 5432
      POSTGRES_USER: djangouser
      POSTGRES_PASSWORD: source_test_password
      ALLOWED_HOSTS: "*"
      ENABLE_SIGNUP: 1
      TANDOOR_PORT: 80
    ports:
      - "18080:80"
    depends_on:
      db_source:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/openapi"]
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 20

  target:
    image: ghcr.io/silasg/recipes-fork-default-unit:2.6.4
    environment:
      SECRET_KEY: target-test-secret-key-not-for-production
      DB_ENGINE: django.db.backends.postgresql
      POSTGRES_HOST: db_target
      POSTGRES_DB: djangodb
      POSTGRES_PORT: 5432
      POSTGRES_USER: djangouser
      POSTGRES_PASSWORD: target_test_password
      ALLOWED_HOSTS: "*"
      ENABLE_SIGNUP: 1
      TANDOOR_PORT: 80
    ports:
      - "18081:80"
    depends_on:
      db_target:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/openapi"]
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 20
