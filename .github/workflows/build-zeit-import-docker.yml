name: Build zeit-import Docker Image

on:
  push:
    branches:
      - develop
      - fork/default-unit
    paths:
      - 'contrib/zeit_import/**'
      - '.github/workflows/build-zeit-import-docker.yml'
    tags:
      - 'zeit-import/v*'
  workflow_dispatch:

jobs:
  build-container:
    name: Build zeit-import Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Run tests
        working-directory: ./contrib/zeit_import
        run: |
          pip install pytest
          python3 -m pytest tests/ -q

      - name: Compute image tags
        id: tags
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/recipes-zeit-import"
          if [[ "$GITHUB_REF" == refs/tags/zeit-import/v* ]]; then
            # Release: zeit-import/v1.2.3 -> 1.2.3, 1.2, 1, latest
            VERSION="${GITHUB_REF#refs/tags/zeit-import/v}"
            MAJOR="${VERSION%%.*}"
            MINOR="${VERSION%.*}"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:${MINOR},${IMAGE}:${MAJOR},${IMAGE}:latest"
          else
            # Branch push / manual: never moves a release tag
            TAGS="${IMAGE}:edge,${IMAGE}:${GITHUB_SHA}"
          fi
          echo "TAGS=${TAGS}" >> $GITHUB_OUTPUT
          echo "Image tags: ${TAGS}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: contrib/zeit_import
          file: contrib/zeit_import/Dockerfile
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
