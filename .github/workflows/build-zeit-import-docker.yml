name: Build zeit-import Docker Image

on:
  push:
    branches:
      - develop
      - fork/default-unit
    paths:
      - 'contrib/zeit_import/**'
      - '.github/workflows/build-zeit-import-docker.yml'
  workflow_dispatch:

jobs:
  build-container:
    name: Build zeit-import Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Run tests
        working-directory: ./contrib/zeit_import
        run: |
          pip install pytest
          python3 -m pytest tests/ -q

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: contrib/zeit_import
          file: contrib/zeit_import/Dockerfile
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/recipes-zeit-import:latest
            ghcr.io/${{ github.repository_owner }}/recipes-zeit-import:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
